<!doctype html>
<html lang="hu" data-theme="dark" data-notes="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Packet Tracer parancstár</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">

  <!-- Mentett téma alkalmazása még a kirajzolás előtt (nincs villanás) -->
  <script>
    try {
      var savedTheme = localStorage.getItem('pt-cheatsheet-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      if (localStorage.getItem('pt-cheatsheet-notes') === 'off') {
        document.documentElement.setAttribute('data-notes', 'off');
      }
    } catch (e) { /* tárhely nem elérhető – marad a sötét téma */ }
  </script>

  <!-- Betűtípusok: offline módban a rendszer-betűkészletre vált vissza -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="../kozos/tema.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#results">Ugrás a parancsokhoz</a>

  <!-- ===== Ragadós fejléc: márka, keresés, kategóriák =====
       Keskeny nézetben három sor, széles nézetben egy sor (a kategóriák
       ilyenkor az oldalsávba kerülnek). -->
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-tile" aria-hidden="true">
          <svg class="brand-mark" viewBox="0 0 24 24">
            <rect x="9" y="2.5" width="6" height="5" rx="1.2"/>
            <rect x="2.5" y="16.5" width="6" height="5" rx="1.2"/>
            <rect x="15.5" y="16.5" width="6" height="5" rx="1.2"/>
            <path d="M12 7.5v4.5M5.5 16.5V12h13v4.5"/>
          </svg>
        </span>
        <span class="brand-name">Packet Tracer <strong>parancstár</strong></span>
      </div>

      <div class="brand-actions">
        <a class="icon-btn" href="../" aria-label="Vissza az osztályoldal kezdőlapjára" title="Osztályoldal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10"/></svg>
        </a>
        <span id="resultCount" class="result-count" aria-live="polite"></span>
        <button id="notesToggle" class="toggle-btn" type="button" aria-pressed="true" title="Magyarázatok ki/be (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 10h16M4 14h10M4 18h16"/></svg>
          <span class="toggle-label">Magyarázat</span>
          <span class="toggle-switch" aria-hidden="true"></span>
        </button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Világos téma bekapcsolása">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
      </div>

      <div class="search">
        <label for="search" class="search-prompt" id="searchPrompt" aria-hidden="true">PT#</label>
        <input id="search" type="search" aria-label="Parancsok keresése"
               placeholder="vlan, ospf, nat, trönk, jelszó, garázsajtó…"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button id="clearSearch" class="search-clear" type="button" aria-label="Keresés törlése" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>

      <nav id="filters" class="filters" aria-label="Kategóriák"></nav>
    </div>
  </header>

  <div class="shell">
    <!-- ===== Oldalsáv: kategóriák + témák, széles kijelzőn (JS tölti fel) ===== -->
    <nav id="toc" class="sidebar" aria-label="Tartalomjegyzék"></nav>

    <div class="content">
      <!-- ===== Kártyák (JS tölti fel) ===== -->
      <main id="results" class="results" tabindex="-1"></main>

      <!-- ===== Üres találati lista ===== -->
      <section id="empty" class="empty" hidden>
        <h2>Nincs találat</h2>
        <p id="emptyText">Próbálj rövidebb kifejezést, vagy válts a Mind kategóriára.</p>
        <button id="emptyReset" class="btn" type="button">Szűrők törlése</button>
      </section>

      <footer class="footer">
        <span><kbd>/</kbd> keresés</span>
        <span><kbd>Enter</kbd> első találat másolása</span>
        <span><kbd>Esc</kbd> keresés törlése</span>
        <span><kbd>M</kbd> magyarázatok ki/be</span>
        <span>A másolás a magyarázatok nélküli, bemásolható parancsokat adja.</span>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
