  <script>
    /* Mentett téma alkalmazása még a kirajzolás előtt (nincs villanás) */
    try {
      var savedTheme = localStorage.getItem('pt-cheatsheet-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) { /* tárhely nem elérhető – marad a sötét téma */ }
  </script>
